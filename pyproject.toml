[project]
name = "claude-on-the-fly"
dynamic = ["version"]
description = "Remote access to Claude Code via Slack and Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "croniter>=2.0.0",
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "python-dotenv>=1.2.2",
    "python-liquid>=2.1.0",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "slack-bolt>=1.27.0",
    "textual>=8.2.6",
]

[project.scripts]
claude-slack = "claude_on_the_fly.slack:main"
claude-telegram = "claude_on_the_fly.telegram:main"
claude-cron = "claude_on_the_fly.cron:main"
claude-jobs = "claude_on_the_fly.jobs.cli:main"
claude-tui = "claude_on_the_fly.tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    # Pinned to the same minor the pre-commit hook installs. Undeclared, `uv run
    # ruff` fell through to whatever ruff was on PATH, so a hand-run fix could
    # differ from what the gate applies.
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
# Line length is left at ruff-format's default: raising it would reflow every
# file in the repo, which is a reformat, not a lint change.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    # ruff-format owns wrapping; E501 only fires where it deliberately can't
    # break (long string literals, URLs in comments).
    "E501",
    # Em-dashes and arrows are used on purpose throughout the prose in
    # docstrings, comments, and user-facing strings.
    "RUF001",
    "RUF002",
    "RUF003",
    # Textual declares BINDINGS / DEFAULT_CSS as plain mutable class
    # attributes; that is the framework's own interface, not our default.
    "RUF012",
    # The Frontend ABC's optional hooks (set_orchestrator, notify_start,
    # notify_complete) are concrete no-ops on purpose so a frontend overrides
    # only what it can actually do.
    "B027",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/claude_on_the_fly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_on_the_fly"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
# Typecheck the shipped package only. The test suite is built out of Mock and
# hand-rolled fake doubles passed where a real type is annotated, which is the
# point of a double and not something ty can be made to like: checking it
# reported 129 diagnostics, none of them defects. Scoping it here states what is
# actually covered, instead of leaving it to depend on which files a pre-commit
# run happened to pass in.
include = ["src"]
