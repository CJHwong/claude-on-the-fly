[project]
name = "claude-on-the-fly"
dynamic = ["version"]
description = "Remote access to Claude Code via Telegram, Slack, and Gmail"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "croniter>=2.0.0",
    "httpx>=0.28.1",
    "markdown-it-py>=3.0.0",
    "python-dotenv>=1.2.2",
    "python-liquid>=2.1.0",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "slack-bolt>=1.27.0",
    "textual>=8.2.6",
]

[project.scripts]
claude-telegram = "claude_on_the_fly.telegram:main"
claude-slack = "claude_on_the_fly.slack:main"
claude-gmail = "claude_on_the_fly.gmail:main"
claude-schedule = "claude_on_the_fly.scheduler:main"
claude-symphony = "claude_on_the_fly.symphony.cli:main"
claude-jobs = "claude_on_the_fly.jobs.cli:main"
claude-tui = "claude_on_the_fly.tui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/claude_on_the_fly/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_on_the_fly"]

[tool.ty.environment]
python = ".venv"
