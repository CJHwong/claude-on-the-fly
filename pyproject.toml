[project]
name = "claude-on-the-fly"
version = "0.1.0"
description = "Remote access to Claude Code via Telegram, Slack, and Gmail"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "croniter>=2.0.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.7",
    "pyyaml>=6.0",
    "slack-bolt>=1.27.0",
]

[project.scripts]
claude-telegram = "claude_on_the_fly.telegram:main"
claude-slack = "claude_on_the_fly.slack:main"
claude-gmail = "claude_on_the_fly.gmail:main"
claude-schedule = "claude_on_the_fly.scheduler:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_on_the_fly"]

[tool.ty.environment]
python = ".venv"
