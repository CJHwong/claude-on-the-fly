name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # gitleaks scans history, and hatch-vcs derives the version from tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # The ty hook typechecks against .venv (see [tool.ty.environment]), so the
      # dev env has to exist before prek fires. --locked fails CI on a stale lock.
      - name: Sync dev env
        run: uv sync --locked

      - name: prek
        run: |
          uv tool install prek
          prek run --all-files || (git --no-pager diff && false)

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - name: checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Sync dev env
        run: uv sync --locked

      # Two suites run a real jail rather than asserting about argv:
      # test_sandbox_jail_live.py (the Linux boundary) and test_sandbox_parity.py
      # (the same contract on whichever jail the host provides). Both skip
      # themselves when bubblewrap is absent, so without this the suite goes green
      # having tested nothing.
      - name: Install bubblewrap
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # Ubuntu 23.10 and later gate unprivileged user namespaces behind AppArmor.
      # The namespace is still created, so this does not look like "userns is
      # off"; it surfaces later as bwrap being refused netlink when it brings up
      # loopback in the new netns ("Failed RTM_NEWADDR: Operation not permitted").
      # This is the same one-line change an operator makes on such a host, and it
      # is recorded in docs/how-to/enable-sandboxing.md.
      - name: Allow unprivileged user namespaces
        run: |
          echo "kernel: $(uname -r)"
          echo "lsm: $(cat /sys/kernel/security/lsm 2>/dev/null)"
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          if bwrap --ro-bind / / --unshare-net /bin/true; then
            echo "jail starts: yes"
          else
            echo "jail starts: NO (the next step will fail and say so)"
          fi

      # A skipped boundary test is indistinguishable from a passing one, which is
      # the failure this whole subsystem is built to avoid. Runners have permitted
      # unprivileged user namespaces so far; if that changes, this step says so
      # instead of the suite quietly covering less than it claims.
      - name: Linux jail and parity contracts must actually run
        env:
          # Turns "no jail available" from a skip into a collection error, so the
          # suites cannot go green having tested nothing. Enforced by the test
          # files rather than by grepping their output: a case may legitimately
          # skip for an unrelated reason (no ssh-agent on a runner) and that must
          # not read as an unexercised boundary.
          COTF_REQUIRE_JAIL: "1"
        run: |
          uv run --no-sync pytest \
            tests/test_sandbox_jail_live.py tests/test_sandbox_parity.py -q -rs

      # A hung test must name itself. Left to the job's own `timeout-minutes`,
      # the step is *cancelled* rather than failed, and GitHub archives no log
      # for a cancelled step -- so a suite that stops making progress produces
      # zero evidence about where. Two additions fix that:
      #
      #   timeout 600           SIGTERM at 10 minutes, inside the 15-minute job
      #                         cap, so the step FAILS (124) and its log is kept.
      #   faulthandler_timeout  dumps every thread's stack once a single test
      #                         passes 60s, which names the offender directly.
      #
      # The suite runs in ~3 minutes, so neither bound is near normal operation.
      - name: pytest
        run: timeout 600 uv run --no-sync pytest -q -o faulthandler_timeout=60
