# Which CLIs the sandboxed agent reaches through the command broker.
#
# A shimmed tool runs OUTSIDE the sandbox with the operator's real credential, so
# adding an entry here grants a capability. Read the trade in
# docs/agent/broker.md before extending it.
#
# Operator overrides go in ~/.claude-on-the-fly/commands.yaml, merged by name over
# the entries below. Editing this file inside the installed package is not the
# supported route: it is replaced on upgrade.
#
# Fields, all optional except `name`:
#   name             command name shimmed onto the agent's PATH. Must be on the
#                    daemon's PATH or it is skipped (a shim for a missing binary
#                    would turn "command not found" into a confusing broker error).
#   readback         subcommands that must never cross into the sandbox, written
#                    as the leading words of the command. Matched against the
#                    leading non-flag tokens, so "auth token" also refuses
#                    `gh --repo o/r auth token`.
#   readback_flags   flags that make any subcommand print the secret.
#   env_passthrough  extra env names the real binary needs. Kept narrow: the
#                    broker runs unjailed, so anything not listed stays out of the
#                    subprocess.
#
# There is deliberately no allow/deny policy beyond readback. `gh api --method
# DELETE` defeats any subcommand denylist, so a parser here would be a boundary
# that can be walked around. Scope the *token* instead.

tools:
  - name: gh
    # `gh auth token` and `--show-token` print the credential itself. Forwarding
    # either would place the token in the sandbox and defeat the whole design.
    readback:
      - auth token
    readback_flags:
      - --show-token
    env_passthrough: [GH_HOST, GH_REPO, GH_PAGER, NO_COLOR]

  - name: acli
    # Atlassian CLI. `acli auth` offers login / logout / status / switch and no
    # token-printing subcommand at all, checked against `acli auth --help`, so
    # there is no readback to refuse. What is refused is the auth *state*
    # changing: `logout` would sign the operator out globally from inside an agent
    # turn, and `login` / `switch` are interactive and would only hang the broker.
    readback:
      - auth logout
      - auth login
      - auth switch
    env_passthrough: [ACLI_SITE, NO_COLOR]
