# claude-on-the-fly settings: which hosts the agent may reach, which credentialed
# CLIs it may run through the command broker, and whether tool calls are gated.
# Credentials are the one thing that does NOT live here -- tokens stay in .env,
# where a secret scanner expects them.
#
# Saving this file is enough. It is re-read when its timestamp changes, so an edit
# takes effect at the next read rather than the next restart. The exceptions are
# named for you: change something that was read once at startup (a bound socket, a
# PATH shim, whether a service exists at all) and the next turn tells you a restart
# is needed, instead of quietly running the old value.
#
# There are two copies of this file. The one inside the package holds the defaults
# and is replaced on upgrade; the one at ~/.claude-on-the-fly/config.yaml is yours
# to edit and is never overwritten, not even by an upgrade. If you are reading this
# from your own copy, you are in the right place.
#
# The whole directory moves together: set COTF_DATA_DIR in the environment before
# launching to give that daemon its own data dir (its own config.yaml, .env,
# cron.yaml, logs, and state) instead of ~/.claude-on-the-fly. It must be a real
# environment variable -- this file and .env live inside the directory, so neither
# can point at it. Two daemons on one machine are one directory apart.
#
# Settings that used to be COTF_SANDBOX* / AGENT_BACKEND / CLAUDE_MODE and friends
# live here now, under `sandbox:` and `agent:`. The environment variables still work
# and still win, so nothing breaks by leaving them in .env -- but they are no longer
# documented and will not gain new options. Credentials stay in .env.
#
# Yours is merged over the defaults one section at a time, so a typo in `egress:`
# cannot cost you your `commands:` additions -- the broken section logs an ERROR
# naming itself and falls back, and the others still load.
#
# Because your copy is never overwritten, a new section added by an upgrade will not
# appear in it on its own. `[g]` in the TUI opens yours; the defaults above are the
# reference for anything missing.
#
# That path is deliberately NOT in the seatbelt write allowlist. This file decides
# what runs outside the sandbox holding real credentials, and which hosts skip the
# operator prompt, so a sandboxed agent must not be able to grant itself either.

egress:
  # Hosts tunnelled without asking the operator.
  #
  # The bundled criterion is narrow on purpose: a host earns a place here only if
  # a supported backend cannot complete a turn without it, so the model APIs and
  # nothing else. Gating those would stop every fresh deployment on an approval
  # for the agent's own first LLM call.
  #
  # Everything else is a decision worth making explicitly, which is why the
  # obvious candidates are missing: a package install is arbitrary code execution,
  # github.com grants writes, and telemetry and self-update endpoints are optional
  # by definition. Add what your jobs actually need, and say why:
  #
  #   allow:
  #     - pypi.org               # uv/pip installs
  #     - files.pythonhosted.org # ...and the sdists/wheels they fetch
  #     - github.com             # git clone/push. Grants writes.
  #
  # A host here is reached without a prompt for the whole session, and the proxy
  # does not inspect what crosses it (no TLS interception -- see
  # docs/explanation/security-model.md), so each entry is a covert channel you
  # are accepting.
  allow:
    # claude backend, API-key auth. The credential broker covers this when a key
    # is provisioned; listed for the OAuth case, where it cannot.
    - api.anthropic.com
    # codex backend, API-key auth
    - api.openai.com
    # codex backend, ChatGPT login. Verified against a live run: codex reaches
    # both of these and cannot complete a turn without them.
    - chatgpt.com
    - ab.chatgpt.com

  # Hostnames, or IPv4/IPv6 addresses, allowed to resolve to a private or
  # loopback address. This is a separate opt-in from `allow`: adding a name to
  # the normal allowlist never disables DNS-rebinding/SSRF protection. Use this
  # only for a known local development service, and keep the service bound to
  # the intended interface. Link-local addresses stay refused even when listed.
  private_allow: []

  # Hosts refused outright, never offered to the operator. Cloud metadata
  # endpoints hand instance credentials to anything that can reach them, and no
  # legitimate agent task needs them, so they are not worth a prompt.
  #
  # Your entries are added to this list and cannot remove one. The merge is
  # one-way on purpose: no config edit, and no agent that somehow gets a write
  # here, can re-open a metadata endpoint.
  never_ask:
    - metadata.google.internal
    - metadata.goog
    - instance-data
    - metadata

commands:
  # CLIs the sandboxed agent reaches through the command broker.
  #
  # A shimmed tool runs OUTSIDE the sandbox with your real credential and only its
  # output crosses back, so adding an entry grants a capability. Read the trade in
  # docs/how-to/broker-a-command.md first.
  #
  # A tool NOT listed here is not shimmed, which means the agent runs the real
  # binary inside the jail, where the seatbelt denies its credential store. It
  # fails on its own config file. That is the intended outcome, not a bug -- but
  # it is also why an unlisted-and-needed tool looks like a broken tool.
  #
  # Fields, all optional except `name`:
  #   name             command name shimmed onto the agent's PATH. Must be on the
  #                    daemon's PATH or it is skipped (a shim for a missing binary
  #                    would turn "command not found" into a confusing broker
  #                    error).
  #   readback         subcommands that must never cross into the sandbox, written
  #                    as the leading words of the command. Matched against the
  #                    leading non-flag tokens, so "auth token" also refuses
  #                    `gh --repo o/r auth token`.
  #   readback_flags   flags that make any subcommand print the secret.
  #   env_passthrough  extra env names the real binary needs. Kept narrow: the
  #                    broker runs unjailed, so anything not listed stays out of
  #                    the subprocess.
  #
  #   allow_read_only   prefixes allowed only when the invocation asks the
  #                     server to read. For a subcommand that is an entire REST
  #                     API behind one word, `allow` is all-or-nothing: `gh api`
  #                     reads a file and also rewrites repository settings.
  #                     Listing it here admits the reads and refuses the writes.
  #                     An explicit `--method`/`-X` decides; without one, a
  #                     parameter flag (`-f`, `-F`) counts as a write, because
  #                     gh switches to POST as soon as a parameter is added.
  #                     Omit the key to keep a tool exactly as it was.
  #
  #   allow_paths       trees outside the session workspace this tool may be
  #                     given absolute path arguments for. Every absolute path is
  #                     refused by default, which is right for a credentialed CLI
  #                     and wrong for one whose job is to read a file the agent
  #                     names. An absolute path that lands inside the session
  #                     workspace never needed this key. The broker runs outside
  #                     the sandbox with the real credential, so an entry that
  #                     reaches a credential store is logged at ERROR and dropped.
  #
  #   boolean_flags     flags that never take a value. A command runs only when
  #                     both flag readings admit it: a bare flag taking the next
  #                     token, and taking none. So without this,
  #                     `systemctl --user status x` is refused, and the agent is
  #                     told to move the flag after the subcommand. List the
  #                     boolean flags the agent writes first.
  #
  #   value_flags       flags that always take the next token as their value, so
  #                     `twg -o json jira workitem get` reads as `jira workitem
  #                     get`. Only list a flag that really takes one: a boolean
  #                     flag listed here hides the next word from the allowlist.
  #                     The readback check ignores this list.
  #
  #   allow             safe leading subcommands. The list is deny-by-default;
  #                    flags and arguments may follow the listed words. A
  #                    credentialed CLI is not a general shell, so `gh api`,
  #                    `gh alias`, auth changes, and mutations stay unavailable
  #                    unless an operator explicitly adds a narrowly chosen
  #                    prefix. The loopback endpoint also requires a per-daemon
  #                    bearer token. A help request (`<words> --help`, `-h`,
  #                    `--version`, or a leading `help`) needs no entry.
  tools:
    - name: gh
      # `gh auth token` and `--show-token` print the credential itself.
      # Forwarding either would place the token in the sandbox and defeat the
      # whole design.
      readback:
        - auth token
      readback_flags:
        - --show-token
      # Reads only. Left out on purpose: `api` (all-or-nothing; see
      # allow_read_only), `pr checkout` and the `download` subcommands (they write
      # files), `gist`, `secret`, `variable`, and anything that mutates.
      allow:
        # pull requests
        - pr list
        - pr view
        - pr diff
        - pr checks
        - pr status
        # issues and repositories
        - issue list
        - issue view
        - issue status
        - repo view
        - label list
        # CI
        - run list
        - run view
        - workflow list
        - workflow view
        # releases
        - release list
        - release view
        # discovery
        - search issues
        - search prs
        - search repos
        - search code
      env_passthrough: [GH_HOST, GH_REPO, GH_PAGER, NO_COLOR]

    - name: acli
      # Atlassian CLI. `acli auth` offers login / logout / status / switch and no
      # token-printing subcommand at all, checked against `acli auth --help`, so
      # there is no readback to refuse. What is refused is the auth *state*
      # changing: `logout` would sign you out globally from inside an agent turn,
      # and `login` / `switch` are interactive and would only hang the broker.
      readback:
        - auth logout
        - auth login
        - auth switch
      allow:
        - jira workitem search
        - jira workitem view
        - jira workitem get
      env_passthrough: [ACLI_SITE, NO_COLOR]

    - name: aws
      # AWS CLI. The credential is whatever ~/.aws and AWS_PROFILE resolve to,
      # so give that profile read-only IAM permissions.
      #
      # Every `allow` entry is one read-only API call. Matching is by whole word,
      # so there is no `describe-*`: each call is listed. Left out on purpose:
      # anything returning environment variables (lambda get-function*, ecs
      # describe-task-definition), secretsmanager, ssm get-parameter*, and s3 cp /
      # sync, which move files. `readback` refuses the calls whose output is
      # itself a credential, so widening `allow` later cannot leak one.
      readback:
        - configure get
        - configure export-credentials
        - sts get-session-token
        - sts get-federation-token
        - sts assume-role
        - sts assume-role-with-saml
        - sts assume-role-with-web-identity
        - sso get-role-credentials
        - ecr get-login-password
        - ecr get-authorization-token
        - eks get-token
        - codeartifact get-authorization-token
        - rds generate-db-auth-token
      allow:
        # identity
        - sts get-caller-identity
        # storage
        - s3 ls
        # logs and metrics. `logs tail --follow` never returns; leave it off.
        - logs describe-log-groups
        - logs filter-log-events
        - logs tail
        - cloudwatch describe-alarms
        - cloudwatch get-metric-statistics
        # compute
        - ec2 describe-instances
        - ecs list-clusters
        - ecs list-services
        - ecs describe-services
        - ecs list-tasks
        - ecs describe-tasks
        - lambda list-functions
        # deployments
        - cloudformation describe-stacks
        - cloudformation describe-stack-events
      env_passthrough: [AWS_PROFILE, AWS_REGION, AWS_DEFAULT_REGION, AWS_PAGER, NO_COLOR]

permissions:
  # Whether a tool call can reach you for approval. Changing mode needs a restart.
  #
  #   off  (default)  Nothing is gated. Byte-identical to the behaviour before
  #                   this feature existed, including --permission-mode
  #                   bypassPermissions.
  #   ask             Permission questions arrive on whichever frontend the
  #                   session belongs to, with approve/deny buttons.
  #
  # What you are asked is NOT the same on every backend, and the difference is
  # worth knowing before you turn this on:
  #
  #   claude (native)  claude's own question, forwarded. It decides what needs
  #                    asking; cotf classifies nothing.
  #   claude (pty)     claude's own question, forwarded out of its terminal
  #                    dialog. Same as above. Note a denial costs one extra
  #                    model turn, because the refusal has to be delivered as a
  #                    message for the turn to end.
  #   codex            cotf's question, not codex's. codex does have an approval
  #                    system, but under `codex exec` there is no way for a human
  #                    to answer it: the policy you pass is overridden to `never`,
  #                    and the reviewer that does run is a model, whose verdict
  #                    cotf cannot intercept. The one hook that can block a call
  #                    also runs *before* codex decides it wants approval. So cotf
  #                    decides what is worth interrupting you for, and that
  #                    decision is a convenience filter, not a security boundary.
  #
  # Cron and the background job queue always stay on bypass. Nobody is watching
  # a cron thread, so gating it would just fail every tool call.
  #
  # Quoted because YAML reads a bare `off` as the boolean false. Writing it bare
  # still works (the loader treats false as off), but `on` is refused rather than
  # guessed at, since it is not one of the two names.
  mode: "off"

  # --permission-mode handed to the claude backends when mode is `ask`. This is
  # what decides how much you get asked about, so it is the volume knob.
  #
  #   default      claude asks about the interesting calls and stays quiet about
  #                reads and inspection. Measured: it asked about chmod,
  #                find -delete, sudo, curl and git init, and did not ask about
  #                ls, cat, echo, git status or Read.
  #   acceptEdits  as default, minus prompts for file edits.
  #   manual       asks about more.
  #   auto         hands the decision to a model instead of to you. Measured on
  #                sonnet 5: it approved all six of a deliberately nasty set
  #                (sudo, a write into /etc, chmod -R 777, find -delete,
  #                ls ~/.ssh, curl) without asking once, at 2.6-3.1s and one
  #                model call each. Pick it if you want fewer interruptions;
  #                do not pick it expecting a safety net. Unavailable on some
  #                models, which silently fall back.
  #
  # bypassPermissions and dontAsk are refused here: both were measured at zero
  # prompts, so pairing either with `ask` produces a deployment that looks gated
  # and is not.
  claude_mode: default

  # How long one approval lasts, and how long you have to answer before the gate
  # gives up and denies. Grants are held in memory and die with the daemon.
  # The 300s answer window is deliberate: claude tolerated a 205s wait and still
  # ran the approved call, so the real limit is your patience, not the CLI's.
  ttl_seconds: 1800
  timeout_seconds: 300

# The sections below moved out of .env. Every key is commented out on purpose: the
# defaults live in the code that reads them, so an absent key means "whatever this
# build does" rather than "whatever this template happened to say". Uncomment what
# you want to pin.
#
# The reasoning behind each one -- what it trades, what it has been measured doing --
# is in docs/reference/config-yaml.md rather than repeated here.

sandbox:
  # Whether the agent process ever holds a real credential.
  # Changing mode needs a chat-daemon restart; the other sandbox keys apply on
  # the next turn.
  #   off (default) inherit the full environment
  #   env           drop every *_API_KEY / *_TOKEN, route models via the broker
  #   jail          as env, plus a seatbelt denying egress and keychain reads (macOS)
  # mode: "off"

  # What happens to the agent's outbound HTTPS. Needs a chat-daemon restart: it
  # decides whether the proxy is constructed at all.
  #   gated (default) the proxy asks you about any host outside `egress.allow`
  #   open            the proxy tunnels any public host without asking
  #   off             no proxy
  # Quote the value. YAML reads a bare `off` as a boolean; both spellings work.
  #
  # `egress.allow` matches host names exactly, with no wildcard and no suffix
  # match, so an agent that reads the open web reaches a new host most turns and
  # gating turns nearly every turn into a prompt. `open` is the setting for that
  # agent. It drops only the allowlist question: a malformed name, a `never_ask`
  # metadata endpoint, and an address resolving private or loopback without
  # `egress.private_allow` are refused exactly as before. What it gives up is
  # inspection -- the tunnel is not read, so a host reached this way is a covert
  # channel. Under `mode: jail` that is the intended pairing: the filesystem
  # denies decide what the agent can read, this decides who it can talk to.
  #
  # `off` under `mode: jail` is a lockdown, not a mistake. The relay still
  # bridges the credential broker, so model calls work and the agent has no
  # internet.
  # egress: gated

  # jail mode only. deny-most makes $HOME opaque; grant the agent's own interpreter
  # (mise, nvm, ~/.local/bin) via extra_paths or the run cannot start. Capped at 3
  # on macOS only, because SBPL has no arrays; Linux takes a list of any length.
  # Entries are granted read-only; `write_paths` below is the one that grants
  # writes.
  # Name a directory, not $HOME: a grant is written after the profile's denies and
  # wins over them. An entry that is the home, an ancestor of it, or a path reaching
  # a credential store or file the profile denies is logged at ERROR and dropped.
  # fs: deny-most
  # extra_paths:
  #   - /opt/homebrew

  # jail mode only. Paths the agent may write as well as read. Same shape and same
  # caps as extra_paths, and every entry extra_paths would refuse is refused here
  # too. A write grant refuses more, because it can leave something behind that
  # runs later outside the jail: an entry reaching a shell rc, a git config, a
  # systemd or autostart unit, a LaunchAgent, a directory on the daemon's PATH, or
  # an agent config tree (~/.claude, ~/.codex, ~/.agents) is logged at ERROR and
  # dropped. That list catches the common mistakes and is not a boundary.
  # Inside a granted tree, a repository's .git/hooks and .git/config and the file
  # behind a linked cron.yaml or config.yaml stay read-only. Name one of those as
  # its own entry to make it writable.
  # Grant the narrowest tree that works. This is the setting that decides what a
  # turn can still change after it ends.
  # write_paths:
  #   - ~/notes

  # Narrow egress to the broker's loopback port and the egress proxy's, nothing else.
  # broker_only_loopback: true

  # jail mode only. Give each chat thread its own agent session store, so a turn
  # reads and writes only its own transcripts instead of every thread's. Off by
  # default: with it off, every backend keeps one shared store, which is where a
  # thread started before this setting existed left its transcript. Turning it on
  # carries each codex thread's rollout into its new home on the next turn.
  # scope_sessions: true

agent:
  # backend: claude (default) | codex
  # Per-backend mode: native | ollama | pty. `pty` runs the CLI's own interactive
  # UI on a terminal, which is what makes the dashboard's watch pane worth
  # looking at; for claude it is also the only mode that reports a context
  # reading and can forward claude's own permission dialog. codex's `pty` needs a
  # hosted pane (see `pane` below) and runs `codex exec` without one.
  # Leave a model unset to let the CLI pick its own.
  # backend: claude
  # claude:
  #   mode: native
  #   model: sonnet
  #   effort: high
  # codex:
  #   mode: native
  #   model: o3
  #   effort: high
  #   # Codex signed in with ChatGPT: the credential broker holds auth.json and
  #   # refreshes it, and the jail hides the file from the turn. Starts the broker
  #   # even with the sandbox off. Restart to apply.
  #   chatgpt_via_broker: true
  # ollama:
  #   model: deepseek-v4-flash:cloud
  #   effort: high
  #   # The window `ctx N%` and auto-compact threshold against. Ollama mode has
  #   # no reliable one to read: claude prints its own table's figure for a model
  #   # it is not actually talking to. State it here and both work; leave it unset
  #   # and neither does. Match it to the CLI's own limit.
  #   context_window: 200000
  # Effort is set by whichever key owns the model. `ollama.effort` applies to the
  # ollama-served model, whichever backend runs under it, and wins whenever the
  # launcher is in play. A backend's own `effort` applies to its native mode,
  # where the CLI is the operator's: unset, nothing is passed and the CLI reads
  # its own config (claude's effortLevel, codex's model_reasoning_effort); set,
  # it overrides that for this daemon's spawns only. Both backends apply it in
  # pty mode too: `-c` is a global codex option rather than an `exec` one, and
  # `--effort` is a session flag interactive claude honours.
  # Both backends accept low | medium | high | xhigh | max; codex additionally
  # accepts minimal and ultra. A level the active backend doesn't accept is
  # ignored with a warning.

  # Named overrides of everything above, for one cron entry at a time. An entry
  # in cron.yaml says `profile: cheap` and runs on that block; an entry that
  # names none runs on the settings above, unchanged. Same nesting and same key
  # names, so a profile reads like the block it overrides. Any key you leave out
  # is inherited, which is why `local` below only has to name the two that
  # differ. A profile also beats the matching environment variable: it is named
  # per entry by the operator, not a daemon-wide default.
  # Every profile is validated at daemon start, so a typo or an uninstalled CLI
  # refuses to start rather than failing on the entry's first fire. Changing a
  # profile's model changes the session identity, so a keyed entry starts a
  # fresh transcript on the next fire instead of resuming its old one.
  # profiles:
  #   cheap:
  #     codex:
  #       model: gpt-5-mini
  #       effort: low
  #   local:
  #     codex:
  #       mode: ollama
  #     ollama:
  #       model: qwen3:30b

  # Compact before answering once the previous turn left the context at or above
  # this share of the window. Unset means compaction only on $compact.
  # auto_compact_pct: 80

  # Caches. skills_cache_ttl_seconds <= 0 probes the CLI every query;
  # pricing_ttl_seconds of 0 always refreshes, negative never expires.
  # skills_cache_ttl_seconds: 3600
  # pricing_ttl_seconds: 21600

  # Host each turn in its own tmux server, so the dashboard's watch pane can
  # mirror the agent's own terminal instead of tailing its transcript. On
  # wherever tmux is installed. Turn it off to run every turn as a plain child:
  # the watch pane then falls back to the transcript, and codex runs
  # `codex exec` rather than its interactive UI. Read per turn, so an edit takes
  # effect on the next one without a restart.
  # pane: true

  # claude-pty, used by claude's pty mode.
  # These controls act during startup preflight.
  # pty:
  #   auto_install: false
  #   auto_refresh: true

watchdog:
  # `claude-watchdog` restarts a daemon whose process is alive but whose
  # heartbeat has gone stale. Nothing else recovers one without a person
  # watching the dashboard. An external scheduler runs the command; this
  # package installs no timer.
  #
  # How long a live process may go silent first. The dashboard calls a daemon
  # broken at 15s, which is right for a colour and wrong for an action: acting
  # that early kills every turn in flight over a briefly starved coroutine. At
  # the 5s heartbeat interval the default is 18 consecutive misses.
  # stale_seconds: 90

interim:
  # Forward the agent's mid-turn narration into the thread while a turn runs, so a
  # long turn is not silent. Off by default; native/ollama backends only (not
  # claude pty); DMs and group DMs only. One message per turn, each update appended
  # to it so it grows into a timeline, and left in the thread when the turn ends.
  # Pacing, in seconds: silence, then one update per gap.
  # progress: true
  # warmup_seconds: 300
  # min_gap_seconds: 300

slack:
  # Who may reach the agent. Read per message, so adding a sender takes effect on their
  # next one, no restart. One list, routed by Slack id prefix: B... is a bot and bypasses
  # the @mention gate, anything else (U.../W.../"*") is a human. Empty is fail-closed
  # except for the token's own id -- under a bot token that is the BOT's, not yours, so
  # list your own U... id or your DMs are dropped. The startup log shows what is live.
  # allowed_senders: [U012ABCDEF, B07JPABE2]
  # Everyone: allowed_senders: ["*"] -- must be quoted; a bare * is YAML alias syntax
  # blocked_senders: [B0NOISYBOT]   # wins over the allowlist
  # silent_senders: [B0CRONBOT]     # trigger the agent, post no reply

  # Optional per-bot gate, evaluated before a session or agent process is created.
  # Bot ids here must still appear in allowed_senders. Invalid policies log an
  # error and preserve normal trusted-bot behavior rather than dropping work.
  #
  #   mode: all        every message reaches the agent (the default)
  #         selective  `process_if` decides; everything else is dropped
  #         drop       nothing from this bot reaches the agent
  #
  # `process_if` and `drop_before_ai` are your patterns, not a fixed vocabulary:
  # which messages from YOUR bot are worth an agent turn is a question only you
  # can answer, and a Jira bot, a PagerDuty bot and a non-English workspace have
  # nothing in common to hardcode. Each entry is a name and a regular expression
  # matched against the message text, case-insensitively. Order matters, and the
  # first match wins.
  #
  # `explicitly_mentions_agent` is the one bare name, because "does this address
  # the agent" is not a text match you could write yourself.
  #
  # Under `selective` a message matching nothing is DROPPED. `drop_before_ai`
  # does not decide that; it only names the drop, so a known routine event is
  # distinguishable in the log from a message no rule describes.
  #
  # The patterns below are a worked example from one CRM bot. They are not
  # defaults and nothing ships them: replace them with your own.
  # bot_policies:
  #   B07JPABE2:
  #     mode: selective
  #     process_if:
  #       - explicitly_mentions_agent
  #       - name: ticket_activity
  #         match: 'new (ticket )?(comment|reply|mention)'
  #       - name: support_escalation
  #         match: 'support escalation|priority: ?urgent|severity: ?s[12]'
  #     drop_before_ai:
  #       - name: discovery_booked
  #         match: 'discovery booked'
  #       - name: deal_or_signature_update
  #         match: 'deal (won|stage)|ready to sign|signature'
  #       - name: payment_notification
  #         match: 'payment received|overdue invoice'
  #     # Defaults to true. A drop is logged at INFO so a pattern that does not
  #     # match what you expected is visible as a log line, not as silence.
  #     audit_dropped_events: true

  # Reply footer and stats: off | summary | detailed

  # Slash command to register. Must match the app manifest; needs a restart.
  # slash_command: /cotf

  # Background-job trigger. Absent means $job; set it empty ("") to turn jobs off.
  # Trigger and queue are constructed at Slack startup, so changing it needs a restart.
  # job_command: "$job"
  # Failure-alert target: a Slack channel or DM id. Unset = no alerts. Needs a restart.
  # alert_target: C0123456789

  # Threads retained before LRU eviction, turns per thread before the $continue gate;
  # seconds a gate notice is held (0 posts now), seconds a "tag me" notice waits (0 = never).
  # session_cap: 1000
  # reply_soft_limit: 10
  # reply_limit_notice_seconds: 0
  # mention_notice_seconds: 0

  # Per-chat persona: a file, relative to the data root, that REPLACES the data-root
  # CLAUDE.md for one chat. Key by channel id (survives renames; the C... in any Slack
  # link), channel name, a U... sender id, `dm`, or `default`. Read per message.
  # Key order and failure handling: docs/reference/persona.md
  # personas:
  #   C07ABCDEF: personas/oncall.md    # #ops-alerts
  #   dm: personas/guest.md
  #   default: personas/team.md

telegram:
  # One bot, one operator. There is no list.
  # allowed_user_id: 123456789
  # stats: summary

  # Failure-alert target for cron/job failures: a Telegram chat id (a DM chat
  # id equals the user id). Unset means no alerts. The worker and the cron
  # producer build their alert sinks at startup, so changing it needs a
  # restart.
  # alert_target: 123456789

  # Per-chat persona, keyed by chat id, plus `default`. docs/reference/persona.md
  # personas:
  #   "123456789": personas/private.md
  #   default: personas/team.md

suggestions:
  # Ask the agent to end every chat reply with follow-up suggestions, rendered
  # as tappable buttons under the reply (Slack actions block, Telegram inline
  # keyboard). Costs a few dozen extra tokens per turn; when the agent does not
  # emit the block, no buttons are shown. Off by default.
  # enabled: true

jobs:
  # Queue adapter shared by the worker and the producers. Needs a restart: the
  # worker is a separate process started with the old value.
  # queue_kind: file

  # Worker construction settings. All three need a claude-jobs restart.
  # concurrency is how many agent CLIs this machine hosts, separate from a cron
  # entry's own max_concurrent. timeout of 0 or less means no limit.
  # concurrency: 1
  # poll_interval_s: 2.0
  # timeout: 3600

  # How long a finished one-shot job workspace is kept before the worker retires
  # it at startup, in days; 0 keeps them forever. Only workspaces under
  # workspaces/<platform>/__runs are swept. A job with a session key keeps its
  # workspace indefinitely, however old: that is what turn 2 resumes from.
  # Needs a claude-jobs restart.
  # workspace_keep_days: 30

  # Experimental. On a failed job, read the run's own transcript and append
  # deterministic signals to the alert: whether the agent finished its turn, how
  # the wall clock split between the model and its tools, whether a script the
  # prompt named ever ran, and whether the same tool kept erroring. codex and
  # claude; another backend alerts exactly as before.
  # diagnose_failures: false

  # Per-job persona, keyed by the job key exactly as the producer set it. Only cron
  # sets one: the entry name, or <entry>/<item key> for a producer entry. A job with
  # no key ($job, claude-jobs enqueue) or an unlisted one gets `default`.
  # personas:
  #   daily-digest: personas/digest.md   # a cron entry name
  #   stale-prs/42: personas/nudge.md    # producer entry: <entry>/<item key>
  #   default: personas/jobs.md

  # JOBS_SLACK_TOKEN stays in .env: it is a credential. Set it to a bot (xoxb-)
  # token when SLACK_TOKEN is a user token, or the worker posts replies as you and
  # the Slack daemon re-ingests its own output.

logs:
  # Retention in days for ~/.claude-on-the-fly/logs; 0 disables pruning. Assume
  # anything written there leaves the machine and sits for this long.
  # Applied the next time pruning runs, normally daemon startup.
  # keep_days: 30

  # Machine name in <role>-<host>-<date>.log. Defaults to the short hostname.
  # Applied at logger startup and again at daily rollover.
  # host_tag: laptop

  # LOG_LEVEL stays an environment variable: logging is configured before this file
  # can be parsed, so a complaint about the file needs somewhere to go.

daemons:
  # How a frontend comes back up, when something other than this package owns
  # it. Leave it out and the supervisor starts the daemon itself, as a child of
  # whatever ran the command, which is right for a deployment you drive with
  # `claude-tui start` and a terminal.
  #
  # Set it when a service manager owns the daemons, which is the usual shape on
  # a server. Stopping works either way, because systemd and launchd leave a
  # deliberately stopped service alone. Starting does not: without this,
  # `claude-tui start`, `claude-tui restart` and the dashboard's upgrade would
  # leave the service manager's unit inactive while an unsupervised copy served
  # traffic. Nothing brings that unit back on its own, because the manager reads
  # the external stop as a clean exit.
  #
  # `{frontend}` is replaced with the frontend name, so one template covers
  # every unit. The command runs through a shell. After it returns, the
  # supervisor waits for the daemon's heartbeat and reports its pid, so a
  # command that prints nothing is fine.
  # restart_command: systemctl --user restart cotf-{frontend}

upgrade:
  # An upgrade is up to two commands, split by whether the daemons have to be
  # down for them. `prepare_command` runs first, with every daemon still
  # serving, so it is where the network round trip belongs. `command` replaces
  # the code the daemons are running, so they stop for it and come back after.
  #
  # Leave it out and the commands are derived from how this copy was installed:
  # a git checkout gets `git fetch` then `git merge --ff-only && uv sync`, and a
  # `uv tool install` gets `uv tool upgrade <tool>` in one step, since uv builds
  # the replacement environment itself. Set them when neither applies, or when
  # your deployment updates some other way (a container image, a pinned tag).
  #
  # Set `prepare_command` only when the split is safe for your command. Anything
  # it changes, a daemon still serving will read, so a fetch is fine and a
  # checkout is not.
  # prepare_command: git fetch --tags
  # command: git checkout v1.4.0 && uv sync
